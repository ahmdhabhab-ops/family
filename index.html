<style>
  :root{
    --bg:#F6F3FF; --card:#FFFFFF; --text:#1F2333; --muted:#8A8FA3;
    --brand:#6C63FF; --brand2:#8B7CFF; --good:#22C55E; --shadow: 0 8px 24px rgba(108,99,255,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:88px;position:relative;}

  /* ---------- Login / profile picker ---------- */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:linear-gradient(160deg,#6C63FF 0%,#8B7CFF 60%,#B7A9FF 100%);color:white;}
  .login h1{font-size:30px;margin-bottom:4px;}
  .login p{opacity:.9;margin-top:0;margin-bottom:28px;}
  .avatar-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:340px;}
  .avatar-pick{background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:20px;padding:20px 10px;cursor:pointer;transition:.15s;color:white;}
  .avatar-pick:hover{background:rgba(255,255,255,0.28);transform:translateY(-2px);}
  .avatar-pick .em{font-size:40px;display:block;margin-bottom:8px;}
  .avatar-pick .nm{font-weight:600;font-size:15px;}

  /* ---------- Header ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:18px 18px 8px;}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .topbar h1{font-size:22px;margin:0;}
  .bell{position:relative;background:var(--card);border:none;width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow);font-size:18px;cursor:pointer;}
  .bell .dot{position:absolute;top:4px;right:4px;background:#FF4D4F;color:white;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  .members-row{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:4px;}
  .member-chip{flex:0 0 auto;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;border:2px solid transparent;}
  .member-chip.me{border-color:var(--brand);}
  .member-chip .em{font-size:20px;}
  .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-start:2px;}
  .dot-home{background:#22C55E;}
  .dot-away{background:#FF4D4F;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;padding:14px 18px 4px;}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:14px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;background:transparent;border:none;}
  .tab.active{background:var(--brand);color:white;}

  .section-title{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:18px 18px 8px;}

  /* ---------- Feed ---------- */
  .feed{padding:0 18px;display:flex;flex-direction:column;gap:10px;}
  .feed-item{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;}
  .feed-item .icon{font-size:26px;line-height:1;}
  .feed-item .body{flex:1;}
  .feed-item .txt{font-size:15px;font-weight:600;margin:0;}
  .feed-item .note{font-size:13px;color:var(--muted);margin:4px 0 0;}
  .feed-item .time{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .share-btn{background:#E7F9EF;color:#128C4A;border:none;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;align-self:flex-start;}
  .poll-block{background:#F1EEFF;border-radius:12px;padding:10px 12px;margin-top:8px;}
  .poll-q{font-size:12px;font-weight:700;color:var(--brand);margin:0 0 6px;}
  .poll-responses{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
  .poll-r{font-size:12px;color:var(--text);}
  .poll-r b{font-weight:700;}
  .poll-reply-row{display:flex;gap:6px;}
  .poll-input{flex:1;border:1px solid #DCD6FA;border-radius:10px;padding:7px 10px;font-size:12px;font-family:inherit;}
  .poll-send-btn{background:var(--brand);color:white;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

  /* ---------- Quick actions ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;}
  .qa{background:var(--card);border:none;border-radius:18px;padding:16px 10px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);}
  .qa:active{transform:scale(0.97);}
  .qa .em{font-size:26px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,0.06);display:flex;border-radius:22px 22px 0 0;overflow:hidden;}
  .navbtn{flex:1;border:none;background:transparent;padding:14px 0 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
  .navbtn.active{color:var(--brand);}
  .navbtn .em{display:block;font-size:20px;margin-bottom:2px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,16,50,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;}
  .sheet h3{margin:0 0 4px;}
  .sheet p.sub{color:var(--muted);margin:0 0 14px;font-size:13px;}
  .sheet textarea{width:100%;border-radius:14px;border:1px solid #E5E1FA;padding:12px;font-size:14px;font-family:inherit;resize:none;min-height:70px;}
  .sheet .row{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:13px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
  .btn.primary{background:var(--brand);color:white;}
  .btn.ghost{background:#F1EEFF;color:var(--brand);}

  /* toast */
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1F2333;color:white;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,0.25);max-width:90%;text-align:center;}

  /* history filters */
  .filters{display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto;}
  .fchip{flex:0 0 auto;padding:8px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .fchip.active{border-color:var(--brand);color:var(--brand);}
  select.fsel{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--text);}

  /* settings */
  .settings-block{background:var(--card);border-radius:18px;margin:0 18px 14px;padding:16px;box-shadow:var(--shadow);}
  .settings-block h4{margin:0 0 10px;font-size:14px;color:var(--muted);}
  .set-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0EEFB;font-size:14px;}
  .set-row:last-child{border-bottom:none;}
  .set-row button{background:#F1EEFF;color:var(--brand);border:none;padding:6px 12px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;}
  .switch{width:44px;height:26px;border-radius:13px;background:#E5E1FA;position:relative;cursor:pointer;flex:0 0 auto;}
  .switch.on{background:var(--brand);}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;background:white;border-radius:50%;transition:.15s;}
  .switch.on .knob{left:21px;}
  input.txtinput{border:1px solid #E5E1FA;border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;}

  /* geofencing additions */
  .home-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;margin-inline-start:4px;}
  .home-badge.home{background:#E7F9EF;color:#128C4A;}
  .home-badge.away{background:#FDECEC;color:#D64545;}
  #homeMapPicker{width:100%;height:280px;border-radius:14px;margin:10px 0;}
</style>

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function sbHeaders(extra){
  return Object.assign({ "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" }, extra||{});
}
async function sbFetch(path, opts){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), 15000); // never let a request hang silently forever
  try{
    const r = await fetch(REST + path, Object.assign({}, opts, { signal: controller.signal }));
    return r;
  }catch(e){
    if(e.name === "AbortError") throw new Error("انتهى وقت الانتظار (15 ثانية) — تأكد من اتصالك بالإنترنت وجرّب كمان مرة.");
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
async function sbGet(path){
  const r = await sbFetch(path, { headers: sbHeaders() });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(path, body){
  const r = await sbFetch(path, { method:"POST", headers: sbHeaders({ "Prefer":"return=representation" }), body: JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(path, body){
  const r = await sbFetch(path, { method:"PATCH", headers: sbHeaders({ "Prefer":"return=representation" }), body: JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(path){
  const r = await sbFetch(path, { method:"DELETE", headers: sbHeaders() });
  if(!r.ok) throw new Error(await r.text());
}

// ---------------- App state ----------------
const state = {
  members: [],
  actionTypes: [],
  events: [],
  familyName: "Our Home 🏠",
  me: null,           // current member object
  tab: "home",        // home | history | settings
  seenEventIds: new Set(),
  unread: [],
  notifPermAsked: false,
  historyFilter: { range: "today", person: "all", type: "all" },
  pendingAction: null, // action type awaiting a note
  homeLocation: null,  // { lat, lng, radius }
  watchId: null,
  polls: {}            // event_id -> poll { id, question, homeapp_poll_responses }
};

const root = document.getElementById("app");

function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function isToday(iso){
  const d = new Date(iso), n = new Date();
  return d.toDateString() === n.toDateString();
}
function isYesterday(iso){
  const d = new Date(iso), y = new Date(); y.setDate(y.getDate()-1);
  return d.toDateString() === y.toDateString();
}
function isThisWeek(iso){
  const d = new Date(iso), n = new Date();
  const start = new Date(n); start.setDate(n.getDate() - n.getDay()); start.setHours(0,0,0,0);
  return d >= start;
}
function pickTemplate(actionType, member){
  if(member.gender === "f" && actionType.verb_template_f) return actionType.verb_template_f;
  return actionType.verb_template;
}
function verbText(ev){
  const tpl = pickTemplate(ev.homeapp_action_types, ev.homeapp_members);
  return tpl.replace("{name}", ev.homeapp_members.name);
}
function verbTextHTML(ev){
  const tpl = pickTemplate(ev.homeapp_action_types, ev.homeapp_members);
  return tpl.replace("{name}", "<bdi>" + esc(ev.homeapp_members.name) + "</bdi>");
}
function notifVerbHTML(n){
  const tpl = pickTemplate(n.homeapp_events.homeapp_action_types, n.homeapp_events.homeapp_members);
  return tpl.replace("{name}", "<bdi>" + esc(n.homeapp_events.homeapp_members.name) + "</bdi>");
}

function pollBlockHTML(ev){
  const poll = state.polls[ev.id];
  if(!poll) return "";
  const responses = poll.homeapp_poll_responses || [];
  const mine = state.me ? responses.find(r => r.member_id === state.me.id) : null;
  return `
    <div class="poll-block">
      ${responses.length ? `<div class="poll-responses">${responses.map(r => `<div class="poll-r"><bdi><b>${esc(r.homeapp_members.name)}</b></bdi>: ${esc(r.response)}</div>`).join("")}</div>` : `<div class="poll-responses"><div class="poll-r" style="color:var(--muted);">ما حدا جاوب لسا</div></div>`}
      <div class="poll-reply-row">
        <input type="text" class="poll-input" data-poll-input="${poll.id}" placeholder="${mine ? 'عدّل جوابك...' : 'اكتب جوابك...'}" value="${mine ? esc(mine.response) : ''}" />
        <button class="poll-send-btn" data-poll-send="${poll.id}">إرسال</button>
      </div>
    </div>
  `;
}

async function submitPollResponse(pollId, text){
  if(!text || !text.trim() || !state.me) return;
  const val = text.trim();
  try{
    await sbPost("/homeapp_poll_responses?on_conflict=poll_id,member_id", [{ poll_id: pollId, member_id: state.me.id, response: val }])
      .catch(async ()=>{
        await sbPatch("/homeapp_poll_responses?poll_id=eq."+pollId+"&member_id=eq."+state.me.id, { response: val });
      });
    await refreshAll();
  }catch(e){
    console.error("submitPollResponse failed:", e);
    alert("ما قدرنا نبعت جوابك: " + (e.message || e));
  }
}

function wirePollButtons(container){
  container.querySelectorAll("[data-poll-send]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const pollId = btn.dataset.pollSend;
      const input = container.querySelector('[data-poll-input="'+pollId+'"]');
      if(input) submitPollResponse(pollId, input.value);
    });
  });
}

function isSystemEvent(ev){ return !ev.member_id; }
function eventEmoji(ev){ return isSystemEvent(ev) ? (ev.system_emoji || "🔔") : ev.homeapp_action_types.emoji; }
function eventTextPlain(ev){ return isSystemEvent(ev) ? (ev.system_text || "") : verbText(ev); }
function eventTextHTML(ev){ return isSystemEvent(ev) ? esc(ev.system_text || "").replace(/\n/g, "<br>") : verbTextHTML(ev); }

// ---------------- Data loading ----------------
async function loadStatic(){
  const [members, actionTypes, settings] = await Promise.all([
    sbGet("/homeapp_members?select=*&order=created_at.asc"),
    sbGet("/homeapp_action_types?select=*&order=sort_order.asc"),
    sbGet("/homeapp_settings?select=*")
  ]);
  state.members = members;
  state.actionTypes = actionTypes;
  const fn = settings.find(s => s.key === "family_name");
  if(fn) state.familyName = fn.value;
  const hlat = settings.find(s => s.key === "home_lat");
  const hlng = settings.find(s => s.key === "home_lng");
  const hrad = settings.find(s => s.key === "home_radius_m");
  state.homeLocation = (hlat && hlng) ? { lat: parseFloat(hlat.value), lng: parseFloat(hlng.value), radius: hrad ? parseInt(hrad.value,10) : 100 } : null;
}

async function loadEvents(){
  const events = await sbGet("/homeapp_events?select=id,note,created_at,member_id,system_emoji,system_text,homeapp_members(id,name,emoji,color,gender),homeapp_action_types(id,emoji,label,verb_template,verb_template_f)&order=created_at.desc&limit=200");
  // detect new events from other people for notification/toast
  if(state.me){
    for(const ev of events){
      if(!state.seenEventIds.has(ev.id)){
        state.seenEventIds.add(ev.id);
        if(state.events.length && ev.member_id !== state.me.id){
          showToast(eventEmoji(ev) + " " + eventTextPlain(ev));
          if(window.Notification && Notification.permission === "granted"){
            new Notification(state.familyName, { body: eventEmoji(ev) + " " + eventTextPlain(ev) });
          }
        }
      }
    }
  } else {
    events.forEach(ev => state.seenEventIds.add(ev.id));
  }
  state.events = events;
}

async function loadUnread(){
  if(!state.me) return;
  state.unread = await sbGet("/homeapp_notifications?recipient_member_id=eq."+state.me.id+"&is_read=eq.false&select=id,created_at,homeapp_events(id,note,created_at,homeapp_members(name,emoji,gender),homeapp_action_types(emoji,label,verb_template,verb_template_f))&order=created_at.desc");
}

async function loadPolls(){
  const polls = await sbGet("/homeapp_polls?select=id,event_id,question,created_at,homeapp_poll_responses(member_id,response,homeapp_members(name,emoji,gender))&order=created_at.desc&limit=50");
  const map = {};
  polls.forEach(p => { map[p.event_id] = p; });
  state.polls = map;
}

async function refreshAll(render=true){
  try{
    await loadEvents();
    await loadUnread();
    await loadPolls();
    if(render) paint();
  }catch(e){ console.error(e); }
}

// ---------------- Web Push ----------------
async function ensurePushSubscription(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  if(Notification.permission !== "granted") return null;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sbPost("/homeapp_push_subscriptions?on_conflict=endpoint", [{
      member_id: state.me.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }]).catch(async ()=>{
      // fallback if upsert-on-conflict header isn't honored: try a plain patch by endpoint
      await sbPatch("/homeapp_push_subscriptions?endpoint=eq."+encodeURIComponent(json.endpoint), { member_id: state.me.id, p256dh: json.keys.p256dh, auth: json.keys.auth });
    });
    return sub;
  }catch(e){
    console.error("Push subscribe failed:", e);
    return null;
  }
}

async function sendPush(title, body, recipientIds){
  if(!recipientIds.length) return;
  try{
    await fetch(SUPABASE_URL + "/functions/v1/send-push", {
      method: "POST",
      headers: { "Authorization": "Bearer " + SUPABASE_ANON_KEY, "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ title, body, recipient_member_ids: recipientIds })
    });
  }catch(e){ console.error("send-push failed:", e); }
}

// ---------------- Home Geofencing ----------------
async function upsertSetting(key, value){
  const patched = await sbPatch("/homeapp_settings?key=eq."+key, { value: String(value) });
  if(!patched || !patched.length){
    await sbPost("/homeapp_settings", { key, value: String(value) });
  }
}

function distMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function onPositionUpdate(pos){
  if(!state.me || !state.homeLocation) return;
  const { latitude, longitude } = pos.coords;
  const d = distMeters(latitude, longitude, state.homeLocation.lat, state.homeLocation.lng);
  const nowHome = d <= state.homeLocation.radius;
  const wasHome = state.me.is_home;

  await sbPost("/homeapp_member_location?on_conflict=member_id", [{ member_id: state.me.id, lat: latitude, lng: longitude, updated_at: new Date().toISOString() }])
    .catch(()=> sbPatch("/homeapp_member_location?member_id=eq."+state.me.id, { lat: latitude, lng: longitude, updated_at: new Date().toISOString() }));
  await sbPatch("/homeapp_members?id=eq."+state.me.id, { is_home: nowHome });
  state.me.is_home = nowHome;

  if(wasHome !== null && wasHome !== nowHome){
    const label = nowHome ? "وصلت عالبيت" : "طالع من البيت";
    const at = state.actionTypes.find(a => a.label === label);
    if(at) await performAction(at, null);
  } else if(state.tab === "home"){
    paint();
  }
}

function startLocationTracking(){
  if(!("geolocation" in navigator) || state.watchId !== null) return;
  if(!state.me || !state.me.location_sharing || !state.homeLocation) return;
  state.watchId = navigator.geolocation.watchPosition(
    onPositionUpdate,
    (err)=> console.error("Geolocation error:", err),
    { enableHighAccuracy: false, maximumAge: 30000, timeout: 25000 }
  );
}

function stopLocationTracking(){
  if(state.watchId !== null){
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
}

async function toggleLocationSharing(){
  const next = !state.me.location_sharing;
  await sbPatch("/homeapp_members?id=eq."+state.me.id, { location_sharing: next, is_home: next ? state.me.is_home : null });
  state.me.location_sharing = next;
  if(next) startLocationTracking(); else stopLocationTracking();
  paint();
}

function geoErrorMessage(err){
  if(err.code === 1) return "ما عطيتنا إذن نوصل لموقعك. لازم توافق عالإذن (أو تفعّله من إعدادات الموقع/المتصفح لهالصفحة) وبعدين جرّب كمان مرة.";
  if(err.code === 2) return "ما قدرنا نحدد موقعك حاليًا (GPS مش متوفر أو الإشارة ضعيفة). جرّب تفتح GPS/خدمات الموقع عالجهاز وجرّب برا أو حدا الشباك.";
  if(err.code === 3) return "أخد وقت أطول من اللازم يلاقي موقعك. جرّب كمان مرة، أو تأكد إنو GPS مفعّل عالجهاز.";
  return "ما قدرنا ناخد موقعك: " + (err.message || "خطأ غير معروف");
}

function setLocStatus(msg){
  const el = document.getElementById("locStatusMsg");
  if(el) el.textContent = msg;
}

async function useCurrentLocationAsHome(){
  if(!("geolocation" in navigator)){
    setLocStatus("❌ الموقع مش مدعوم بهالمتصفح.");
    return;
  }

  // Show the current permission state up front — this alone often explains a lot.
  if(navigator.permissions && navigator.permissions.query){
    try{
      const st = await navigator.permissions.query({ name: "geolocation" });
      const label = st.state === "granted" ? "مسموح ✅" : st.state === "denied" ? "ممنوع ❌" : "لسا ما تحدد (رح يسألك الآن)";
      setLocStatus("⏳ حالة الإذن: " + label + " — عم نحاول ناخد موقعك...");
    }catch(e){ setLocStatus("⏳ عم نحاول ناخد موقعك..."); }
  } else {
    setLocStatus("⏳ عم نحاول ناخد موقعك...");
  }

  let settled = false;
  // A manual, guaranteed timeout — some browsers/devices never call either
  // callback if system-wide Location Services are off, ignoring the
  // geolocation API's own `timeout` option. This makes sure the user always
  // gets a message instead of the status hanging forever.
  const manualTimeout = setTimeout(()=>{
    if(settled) return;
    settled = true;
    setLocStatus("❌ المتصفح ما ردّ خلال 20 ثانية. تأكد إنو خدمات الموقع (GPS) مفعّلة من إعدادات الموبايل نفسو (مش بس المتصفح) — بالأندرويد: Settings → Location → On. جرّب كمان مرة بعدها.");
  }, 20000);

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    if(settled) return;
    settled = true;
    clearTimeout(manualTimeout);
    const { latitude, longitude } = pos.coords;
    await upsertSetting("home_lat", latitude);
    await upsertSetting("home_lng", longitude);
    state.homeLocation = { lat: latitude, lng: longitude, radius: state.homeLocation?.radius || 100 };
    paint();
    setLocStatus("✅ تم تحديد موقع البيت!");
    startLocationTracking();
  }, (err)=>{
    if(settled) return;
    settled = true;
    clearTimeout(manualTimeout);
    console.error("getCurrentPosition failed:", err);
    setLocStatus("❌ " + geoErrorMessage(err));
  }, { enableHighAccuracy: true, timeout: 19000, maximumAge: 0 });
}

async function editHomeRadius(){
  const current = state.homeLocation?.radius || 100;
  const val = prompt("نصف قطر منطقة البيت (بالمتر):", String(current));
  if(!val) return;
  const n = parseInt(val, 10);
  if(!n || n < 10) { alert("رقم غير صالح"); return; }
  await upsertSetting("home_radius_m", n);
  if(state.homeLocation) state.homeLocation.radius = n;
  paint();
}

async function getQuickPosition(){
  if(!("geolocation" in navigator)) return null;
  return new Promise((resolve)=>{
    navigator.geolocation.getCurrentPosition(
      (pos)=> resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      ()=> resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
    );
  });
}

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>resolve(true); s.onerror = ()=>reject(new Error("failed: "+src));
    document.head.appendChild(s);
  });
}
function loadCss(href){
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = href;
  document.head.appendChild(l);
}
let leafletLoadAttempted = false;
async function ensureLeaflet(){
  if(typeof L !== "undefined") return true;
  if(leafletLoadAttempted) return typeof L !== "undefined";
  leafletLoadAttempted = true;
  try{
    loadCss("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css");
    await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js");
    return typeof L !== "undefined";
  }catch(e){
    console.error("Leaflet fallback CDN also failed:", e);
    return false;
  }
}

let homeMapInstance = null, homeMapMarker = null, homeMapPickedLatLng = null;
async function openMapPicker(){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <h3>🗺️ حدد موقع البيت عالخريطة</h3>
      <p class="sub" id="mapPickerSub">عم نحدد مكانك الحالي...</p>
      <div id="homeMapPicker"></div>
      <div class="row">
        <button class="btn ghost" id="cancelMapPick">إلغاء</button>
        <button class="btn primary" id="saveMapPick">حفظ</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // If a home is already set, center on it (so they can nudge it); otherwise
  // start from the user's current GPS position so they don't have to hunt
  // around the map to find themselves.
  let startLat = state.homeLocation?.lat, startLng = state.homeLocation?.lng;
  if(startLat == null || startLng == null){
    const here = await getQuickPosition();
    if(here){ startLat = here.lat; startLng = here.lng; }
    else { startLat = 33.8938; startLng = 35.5018; } // fallback: Beirut, only if GPS truly unavailable
  }
  const subEl = document.getElementById("mapPickerSub");
  if(subEl) subEl.textContent = "دوس عالخريطة أو اسحب العلامة لتحط مكان البيت";
  homeMapPickedLatLng = { lat: startLat, lng: startLng };

  setTimeout(async ()=>{
    const leafletReady = await ensureLeaflet();
    if(!leafletReady){
      const mapDiv = document.getElementById("homeMapPicker");
      if(mapDiv) mapDiv.innerHTML = `<div class="empty" style="padding:20px;">تعذّر تحميل الخريطة (مشكلة اتصال بالإنترنت مع خدمة الخرائط). جرّب زر "📍 موقعي الحالي" بدالها، أو تأكد من الاتصال وجرّب كمان مرة.</div>`;
      return;
    }
    homeMapInstance = L.map("homeMapPicker").setView([startLat, startLng], 16);
    let osmTileErrors = 0;
    let switchedProvider = false;
    const osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(homeMapInstance);
    osmLayer.on("tileerror", ()=>{
      osmTileErrors++;
      if(osmTileErrors >= 3 && !switchedProvider){
        switchedProvider = true;
        homeMapInstance.removeLayer(osmLayer);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
          attribution: "© OpenStreetMap © CARTO",
          subdomains: "abcd"
        }).addTo(homeMapInstance);
      }
    });
    homeMapMarker = L.marker([startLat, startLng], { draggable: true }).addTo(homeMapInstance);
    homeMapMarker.on("dragend", ()=>{ const p = homeMapMarker.getLatLng(); homeMapPickedLatLng = { lat: p.lat, lng: p.lng }; });
    homeMapInstance.on("click", (e)=>{ homeMapMarker.setLatLng(e.latlng); homeMapPickedLatLng = { lat: e.latlng.lat, lng: e.latlng.lng }; });
    // Leaflet sometimes renders blank if the container's real size wasn't
    // known at init time (common right after inserting into a fresh overlay) —
    // forcing a resize recalculation after layout settles fixes that.
    setTimeout(()=>{ if(homeMapInstance) homeMapInstance.invalidateSize(); }, 200);
  }, 80);

  document.getElementById("cancelMapPick").onclick = ()=>{ overlay.remove(); homeMapInstance = null; };
  document.getElementById("saveMapPick").onclick = async ()=>{
    const saveBtn = document.getElementById("saveMapPick");
    if(!homeMapPickedLatLng){
      alert("ما تحدد مكان عالخريطة لسا. دوس عالخريطة أول شي.");
      return;
    }
    saveBtn.textContent = "⏳ عم نحفظ...";
    saveBtn.disabled = true;
    try{
      await upsertSetting("home_lat", homeMapPickedLatLng.lat);
      await upsertSetting("home_lng", homeMapPickedLatLng.lng);
      state.homeLocation = { lat: homeMapPickedLatLng.lat, lng: homeMapPickedLatLng.lng, radius: state.homeLocation?.radius || 100 };
      overlay.remove();
      homeMapInstance = null;
      paint();
      setLocStatus("✅ تم تحديد موقع البيت من الخريطة!");
      startLocationTracking();
    }catch(e){
      console.error("Saving map-picked location failed:", e);
      saveBtn.textContent = "حفظ";
      saveBtn.disabled = false;
      alert("ما قدرنا نحفظ الموقع: " + (e.message || e));
    }
  };
}

// ---------------- Actions ----------------
async function performAction(actionType, note){
  try{
    const created = await sbPost("/homeapp_events", { member_id: state.me.id, action_type_id: actionType.id, note: note || null });
    const ev = created[0];
    if(actionType.creates_poll){
      const question = pickTemplate(actionType, state.me).replace("{name}", state.me.name);
      await sbPost("/homeapp_polls", { event_id: ev.id, question });
    }
    const others = state.members.filter(m => m.id !== state.me.id);
    if(others.length){
      await sbPost("/homeapp_notifications", others.map(m => ({ event_id: ev.id, recipient_member_id: m.id })));
      const sentence = pickTemplate(actionType, state.me).replace("{name}", state.me.name);
      sendPush(state.familyName, actionType.emoji + " " + sentence, others.map(m => m.id));
    }
    await refreshAll();
  }catch(e){
    console.error(e);
    alert("Couldn't post this action. Details: " + (e.message || e));
    throw e;
  }
}

function openActionSheet(actionType){
  if(actionType.allows_note){
    state.pendingAction = actionType;
    paint();
  } else {
    performAction(actionType, null);
  }
}

function toggleNotifPermission(){
  if(!window.Notification){ alert("Notifications aren't supported in this browser/device."); return; }
  if(Notification.permission === "denied"){
    alert("Notifications were previously blocked for this site. To turn them on, open your browser's site settings for this page (tap the lock/info icon in the address bar) and allow Notifications, then come back and try again.");
    return;
  }
  const afterGrant = async ()=>{
    const sub = await ensurePushSubscription();
    paint();
    if(sub) alert("Push notifications are on for this device. 🎉");
    else alert("Couldn't finish enabling push notifications on this device. Try again in a moment.");
  };
  if(Notification.permission === "granted"){
    afterGrant();
    return;
  }
  Notification.requestPermission().then((perm)=>{
    if(perm === "granted") afterGrant();
    else { paint(); alert("Notifications weren't enabled. You can try again anytime from Settings."); }
  });
}

      <div class="set-row" style="margin-top:6px;"><span>نصف القطر (متر)</span><button id="editRadiusBtn">تعديل</button></div>
      <p id="locStatusMsg" style="color:var(--brand);font-size:12px;font-weight:600;margin:8px 0 0;min-height:16px;"></p>
      <p style="color:var(--muted);font-size:11px;margin:8px 0 0;">⚠️ التتبّع بيشتغل بس لمّا التطبيق مفتوح (أو بالخلفية القريبة) عبراوزر الموبايل — مش تتبّع حقيقي بالخلفية لمّا التطبيق مسكّر تمامًا، هيدا قيد من أبل/غوغل على مواقع الويب مش شي فينا نتخطاه بدون تطبيق حقيقي (native).</p>
    </div>
    <div class="settings-block">
      <h4>📍 MY LOCATION SHARING</h4>
      <div class="set-row">
        <span>شارك موقعي مع أهل البيت</span>
        <div class="switch ${state.me.location_sharing ? 'on':''}" id="locShareSwitch"><div class="knob"></div></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin:6px 0 0;">لما تكون مفعّلة، الباقي بيشوفو بس 🟢 بالبيت / 🔴 برا — مش موقعك بالتفصيل.</p>
    </div>
    <div class="settings-block">
      <h4>MEMBERS (4 max for this MVP)</h4>
      ${state.members.map(m => `
        <div class="set-row"><span>${m.emoji} <bdi>${esc(m.name)}</bdi></span></div>
      `).join("")}
    </div>
    <div class="settings-block">
      <h4>NOTIFICATIONS</h4>
      <div class="set-row">
        <span>Browser push notifications</span>
        <div class="switch ${window.Notification && Notification.permission==='granted' ? 'on':''}" id="notifSwitch"><div class="knob"></div></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin:6px 0 0;">Sends a real push notification to this device when someone else logs an activity — works even if the app is closed, as long as it's installed to your home screen.</p>
    </div>
    <div class="settings-block">
      <h4>ACTIONS</h4>
      ${state.actionTypes.map(at => `
        <div class="set-row">
          <span>${at.emoji} ${esc(at.label)}</span>
          <span style="display:flex;gap:6px;">
            <button data-edit="${at.id}">Edit</button>
            <button data-remove="${at.id}">Delete</button>
          </span>
        </div>
      `).join("")}
      <div class="set-row"><span>Add a custom action</span><button id="addActionBtn">+ Add</button></div>
    </div>
  `;
}

function renderActionSheet(){
  const at = state.pendingAction;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <h3>${at.emoji} ${esc(at.label)}</h3>
      <p class="sub">Add an optional note</p>
      <textarea id="noteInput" placeholder="e.g. Pizza from Domino's"></textarea>
      <p id="actionSheetStatus" style="color:var(--brand);font-size:12px;font-weight:600;margin:6px 0 0;min-height:16px;"></p>
      <div class="row">
        <button class="btn ghost" id="cancelNote">Skip</button>
        <button class="btn primary" id="saveNote">Post</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const statusEl = () => document.getElementById("actionSheetStatus");
  const skipBtn = () => document.getElementById("cancelNote");
  const postBtn = () => document.getElementById("saveNote");

  async function submit(note){
    skipBtn().disabled = true;
    postBtn().disabled = true;
    postBtn().textContent = "⏳ عم ننشر...";
    if(statusEl()) statusEl().textContent = "";
    try{
      await performAction(at, note || null);
      state.pendingAction = null;
      overlay.remove();
    }catch(e){
      console.error("Post from note sheet failed:", e);
      postBtn().disabled = false;
      skipBtn().disabled = false;
      postBtn().textContent = "Post";
      if(statusEl()) statusEl().textContent = "❌ ما نجحنا ننشر: " + (e.message || e);
    }
  }

  document.getElementById("cancelNote").onclick = ()=> submit(null);
  document.getElementById("saveNote").onclick = ()=>{
    const note = document.getElementById("noteInput").value.trim();
    submit(note);
  };
}

function renderNotifPanel(){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <h3>Notifications</h3>
      <p class="sub">${state.unread.length} unread</p>
      <div class="feed" style="padding:0;max-height:50vh;overflow-y:auto;">
        ${state.unread.length ? state.unread.map(n => `
          <div class="feed-item">
            <div class="icon">${n.homeapp_events.homeapp_action_types.emoji}</div>
            <div class="body">
              <p class="txt">${notifVerbHTML(n)}</p>
              ${n.homeapp_events.note ? `<p class="note">"${esc(n.homeapp_events.note)}"</p>` : ""}
              <p class="time">${fmtTime(n.homeapp_events.created_at)}</p>
            </div>
          </div>
        `).join("") : `<div class="empty">You're all caught up!</div>`}
      </div>
      <div class="row">
        <button class="btn primary" id="markReadBtn">Mark all read</button>
        <button class="btn ghost" id="closeNotif">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeNotif").onclick = ()=> overlay.remove();
  document.getElementById("markReadBtn").onclick = async ()=>{ await markAllRead(); overlay.remove(); };
}

function wireTabEvents(){
  root.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const at = state.actionTypes.find(a => a.id === el.dataset.action);
      openActionSheet(at);
    });
  });
  if(state.tab === "history"){
    root.querySelectorAll("[data-range]").forEach(el => el.addEventListener("click", ()=>{ state.historyFilter.range = el.dataset.range; paint(); }));
    const pSel = document.getElementById("personSel");
    if(pSel) pSel.addEventListener("change", ()=>{ state.historyFilter.person = pSel.value; paint(); });
    const tSel = document.getElementById("typeSel");
    if(tSel) tSel.addEventListener("change", ()=>{ state.historyFilter.type = tSel.value; paint(); });
    root.querySelectorAll("[data-share]").forEach(el => el.addEventListener("click", ()=>{
      const ev = state.events.find(e => e.id === el.dataset.share);
      if(ev) shareToWhatsApp(ev);
    }));
  }
  if(state.tab === "settings"){
    const rb = document.getElementById("renameFamilyBtn"); if(rb) rb.onclick = renameFamily;
    root.querySelectorAll("[data-edit]").forEach(el => el.onclick = ()=> editAction(state.actionTypes.find(a=>a.id===el.dataset.edit)));
    root.querySelectorAll("[data-remove]").forEach(el => el.onclick = ()=> removeCustomAction(state.actionTypes.find(a=>a.id===el.dataset.remove)));
    const ns = document.getElementById("notifSwitch"); if(ns) ns.onclick = toggleNotifPermission;
    const aa = document.getElementById("addActionBtn"); if(aa) aa.onclick = addCustomAction;
    const ul = document.getElementById("useMyLocationBtn"); if(ul) ul.onclick = useCurrentLocationAsHome;
    const pm = document.getElementById("pickOnMapBtn"); if(pm) pm.onclick = openMapPicker;
    const er = document.getElementById("editRadiusBtn"); if(er) er.onclick = editHomeRadius;
    const ls = document.getElementById("locShareSwitch"); if(ls) ls.onclick = toggleLocationSharing;
  }
}

// ---------------- PWA install support ----------------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}

// ---------------- Boot ----------------
(async function init(){
  try{
    await loadStatic();
    paint();
    setInterval(async ()=>{
      // Don't tear down the screen (and re-stack modals) while the user
      // has a note sheet open or is mid-typing.
      if(state.pendingAction) return;
      if(document.querySelector(".overlay")) return;
      if(document.activeElement && (document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "INPUT")) return;
      try{ await loadStatic(); }catch(e){ console.error(e); }
      await refreshAll();
    }, 2500);
  }catch(e){
    root.innerHTML = `<div class="empty">Couldn't connect to the backend.<br>${esc(e.message||"")}</div>`;
  }
})();
</script>
</body>
</html>
